# Find full documentation here https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: CI

on:
  # Manual invocation.
  workflow_dispatch:

  push:

jobs:
  CI:
    runs-on: 4core-ubuntu-latest-arm-giant

    # See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
    permissions:
      # required by aws-actions/configure-aws-credentials
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: '.java-version'
          distribution: corretto
          cache: sbt
          problem-matcher: true

      - name: Install sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run script/ci.sh to build artefacts
        run: ./scripts/ci.sh

      - name: Put artifacts in the right place
        run: |
          mkdir -p pfi pfi-cli pfi-public-downloads
          mv backend/target/pfi_0.1.0-SNAPSHOT_all.deb pfi/pfi.deb
          mv cli/target/pfi-cli_0.1.0-SNAPSHOT_all.deb pfi-cli/pfi-cli.deb
          mv cli/target/universal/pfi-cli-0.1.0-SNAPSHOT.tgz pfi-public-downloads/pfi-cli.tar.gz

      - name: Upload for playground
        uses: guardian/actions-riff-raff@9b7f9fe778957e6dc3ef4ab70fec015119ccba83 # v4.3.7
        with:
          projectName: investigations::pfi-playground
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          buildNumberOffset: 5000
          contentDirectories: |
            pfi:
              - pfi/pfi.deb
            pfi-cli:
              - pfi-cli/pfi-cli.deb
            pfi-public-downloads:
              - pfi-public-downloads/pfi-cli.tar.gz
          configPath: riff-raff.yaml
          commentingEnabled: 'false'

      - name: Edit riff-raff file prior to re-upload
        run: sed -i -e "s/pfi-playground/pfi-giant/g" riff-raff.yaml

      - name: Upload for giant
        uses: guardian/actions-riff-raff@9b7f9fe778957e6dc3ef4ab70fec015119ccba83 # v4.3.7
        with:
          projectName: investigations::pfi-giant
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          buildNumberOffset: 5000
          contentDirectories: |
            pfi:
              - pfi/pfi.deb
            pfi-cli:
              - pfi-cli/pfi-cli.deb
            pfi-public-downloads:
              - pfi-public-downloads/pfi-cli.tar.gz
          configPath: riff-raff.yaml
          commentingEnabled: 'false'

      - name: Reset checkout just in case
        run: sed -i -e "s/pfi-giant/pfi-playground/g" riff-raff.yaml
