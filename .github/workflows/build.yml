# Find full documentation here https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: CI

on:
  # Manual invocation.
  workflow_dispatch:

  push:

jobs:
  CI:
    runs-on: 4core-ubuntu-latest-arm-giant

    # See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
    permissions:
      # required by aws-actions/configure-aws-credentials
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Generate 'investigations-cross-repo-auth' Token
        id: investigations-cross-repo-auth
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INVESTIGATIONS_CROSS_REPO_AUTH_APP_CLIENT_ID }}
          private-key: ${{ secrets.INVESTIGATIONS_CROSS_REPO_AUTH_APP_PRIVATE_KEY }}
          repositories: guardian/investigations-platform

      - name: Checkout repository & submodules
        uses: actions/checkout@v4
        with:
          token: '${{ steps.investigations-cross-repo-auth.outputs.token }}'
          submodules: recursive

      # TODO: configure caching
      # See https://github.com/actions/setup-java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version-file: '.java-version'
          distribution: corretto
          cache: sbt

      - name: Install sbt
        run: |
          sudo apt-get update
          sudo apt-get install apt-transport-https curl gnupg -yqq
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          echo "deb https://repo.scala-sbt.org/scalasbt/debian /" | sudo tee /etc/apt/sources.list.d/sbt_old.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo -H gpg --no-default-keyring --keyring gnupg-ring:/etc/apt/trusted.gpg.d/scalasbt-release.gpg --import
          sudo chmod 644 /etc/apt/trusted.gpg.d/scalasbt-release.gpg
          sudo apt-get update
          sudo apt-get install sbt

      # TODO: configure caching
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run script/ci.sh to build artefacts
        run: ./scripts/ci.sh

      - name: Put artifacts in the right place
        run: |
          mkdir -p pfi pfi-cli pfi-public-downloads
          mv backend/target/pfi_0.1.0-SNAPSHOT_all.deb pfi/pfi.deb
          mv cli/target/pfi-cli_0.1.0-SNAPSHOT_all.deb pfi-cli/pfi-cli.deb
          mv cli/target/universal/pfi-cli-0.1.0-SNAPSHOT.tgz pfi-public-downloads/pfi-cli.tar.gz

      - uses: actions/setup-node@v3
        with:
          node-version-file: './infra/cdk/.nvmrc'
          cache: npm
          cache-dependency-path: ./infra/cdk/package-lock.json

      - name: cdk synth
        working-directory: ./infra/cdk
        run: |
          npm ci
          npm run lint
          npm run test
          npm run format -- --check
          npm run synth

      - name: riff-raff upload for playground
        uses: guardian/actions-riff-raff@v4
        with:
          projectName: investigations::pfi-playground
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          buildNumberOffset: 5000
          contentDirectories: |
            pfi:
              - pfi/pfi.deb
            pfi-cli:
              - pfi-cli/pfi-cli.deb
            pfi-public-downloads:
              - pfi-public-downloads/pfi-cli.tar.gz
            cdk.out/main/pfi-playground:
              - infra/cdk/cdk.out/main/pfi-playground/pfi-playground-investigations-rex.template.json
          configPath: infra/cdk/cdk.out/main/pfi-playground/riff-raff.yaml
          commentingEnabled: 'false'

      - name: riff-raff upload for (PROD) giant
        uses: guardian/actions-riff-raff@v4
        with:
          projectName: investigations::pfi-giant
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          buildNumberOffset: 5000
          contentDirectories: |
            pfi:
              - pfi/pfi.deb
            pfi-cli:
              - pfi-cli/pfi-cli.deb
            pfi-public-downloads:
              - pfi-public-downloads/pfi-cli.tar.gz
            cdk.out/main/pfi-giant:
              - infra/cdk/cdk.out/main/pfi-giant/pfi-giant-investigations-rex.template.json
          configPath: infra/cdk/cdk.out/main/pfi-giant/riff-raff.yaml
          commentingEnabled: 'false'

      - name: riff-raff upload for postgres
        uses: guardian/actions-riff-raff@v4
        with:
          buildNumberOffset: 107
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: pfi-giant::postgres
          configPath: infra/cdk/cdk.out/postgres/riff-raff.yaml
          contentDirectories: |
            cdk.out:
              - infra/cdk/cdk.out/postgres/pfi-giant-postgres-CODE.template.json
              - infra/cdk/cdk.out/postgres/pfi-giant-postgres-PROD.template.json
