name: infra-build

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/infra*"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./infra/cdk

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: './infra/cdk/.nvmrc'
          cache: npm
          cache-dependency-path: ./infra/cdk/package-lock.json

      - name: cdk synth
        run: |
          npm ci
          npm run lint
          npm run test
          npm run format -- --check
          npm run synth
          cat cdk.out/riff-raff.yaml

      - uses: guardian/actions-riff-raff@9b7f9fe778957e6dc3ef4ab70fec015119ccba83 # v4.3.7
        with:
          buildNumberOffset: 107
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: pfi-giant::postgres
          configPath: infra/cdk/cdk.out/riff-raff.yaml
          contentDirectories: |
            cdk.out:
              - infra/cdk/cdk.out/pfi-giant-postgres-CODE.template.json
              - infra/cdk/cdk.out/pfi-giant-postgres-PROD.template.json
