name: End-to-end tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version-file: .java-version
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/migrate-db/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run isolated E2E suite
        # PDF extraction uses OCRmyPDF, Ghostscript, qpdf and pdfinfo.
        # English is the only OCR language needed by the fixture.
        run: |
          sudo apt-get update
          sudo apt-get install -y ocrmypdf ghostscript qpdf poppler-utils tesseract-ocr-eng
          ./scripts/test-e2e.sh
      - name: Upload test report and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-artifacts/
          retention-days: 7
