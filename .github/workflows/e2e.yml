name: End-to-end tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out transcription-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: guardian/transcription-service
          ref: main
          path: .transcription-service
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version-file: .java-version
          cache: sbt
          problem-matcher: true
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e-tests/package-lock.json
            infra/migrate-db/package-lock.json
            .transcription-service/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: .transcription-service/uv.lock
      - name: Install transcription worker dependencies
        working-directory: .transcription-service
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          npm ci --ignore-scripts
          uv venv --python 3.12
          uv export --frozen --no-hashes --no-emit-project | sed '/^nvidia-/d; /^triton==/d' > "$RUNNER_TEMP/transcription-cpu-requirements.txt"
          uv pip sync --python .venv/bin/python --torch-backend cpu "$RUNNER_TEMP/transcription-cpu-requirements.txt"
          .venv/bin/python -c 'from faster_whisper.utils import download_model; download_model("tiny")'
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Install E2E dependencies and Chromium
        working-directory: e2e-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install extraction tools
        # English is the only OCR language needed by the fixture.
        # ImageMagick's convert removes image alpha channels before external OCR.
        run: |
          sudo apt-get update
          sudo apt-get install -y ocrmypdf ghostscript qpdf poppler-utils tesseract-ocr-eng ffmpeg imagemagick
      - name: Run isolated E2E suite
        working-directory: e2e-tests
        env:
          TRANSCRIPTION_SERVICE_DIR: ${{ github.workspace }}/.transcription-service
        run: |
          npm run typecheck
          npm test
      - name: Upload test report and service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e-tests/reports/
          retention-days: 7
