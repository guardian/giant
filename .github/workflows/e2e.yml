name: End-to-end tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version-file: .java-version
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e-tests/package-lock.json
            infra/migrate-db/package-lock.json
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Install E2E dependencies and Chromium
        working-directory: e2e-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install PDF extraction tools
        # English is the only OCR language needed by the fixture.
        run: |
          sudo apt-get update
          sudo apt-get install -y ocrmypdf ghostscript qpdf poppler-utils tesseract-ocr-eng
      - name: Run isolated E2E suite
        working-directory: e2e-tests
        run: |
          npm run typecheck
          npm test
      - name: Upload test report and service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e-tests/reports/
          retention-days: 7
