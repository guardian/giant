name: End-to-end tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out transcription-service
        uses: actions/checkout@v7
        with:
          repository: guardian/transcription-service
          ref: local-giant-support
          path: .transcription-service
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version-file: .java-version
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e-tests/package-lock.json
            infra/migrate-db/package-lock.json
            .transcription-service/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: .transcription-service/uv.lock
      - name: Install transcription worker dependencies
        working-directory: .transcription-service
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          npm ci --ignore-scripts
          uv venv --python 3.12
          uv export --frozen --no-hashes --no-emit-project | sed '/^nvidia-/d; /^triton==/d' > "$RUNNER_TEMP/transcription-cpu-requirements.txt"
          uv pip sync --python .venv/bin/python --torch-backend cpu "$RUNNER_TEMP/transcription-cpu-requirements.txt"
          .venv/bin/python -c 'from faster_whisper.utils import download_model; download_model("tiny")'
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Install E2E dependencies and Chromium
        working-directory: e2e-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install PDF extraction tools
        # English is the only OCR language needed by the fixture.
        run: |
          sudo apt-get update
          sudo apt-get install -y ocrmypdf ghostscript qpdf poppler-utils tesseract-ocr-eng ffmpeg
      - name: Run isolated E2E suite
        working-directory: e2e-tests
        env:
          TRANSCRIPTION_SERVICE_DIR: ${{ github.workspace }}/.transcription-service
        run: |
          npm run typecheck
          npm test
      - name: Upload test report and service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e-tests/reports/
          retention-days: 7
