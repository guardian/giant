# Appended to application.conf WITHOUT the developer's site.conf by run.mts.
play.http.secret.key = "giant-disposable-e2e-only-secret-key-not-for-deployment"
auth.provider = "database"
auth.enableGenesisFlow = true
auth.database.require2FA = false

neo4j.url = "bolt://127.0.0.1:17687"
postgres.host = "127.0.0.1"
postgres.port = 18432
elasticsearch.hosts = ["http://127.0.0.1:19200"]
# Sniffed container addresses bypass the published host port used by this backend.
elasticsearch.disableSniffing = true
elasticsearch.shards = 1
s3.endpoint = "http://127.0.0.1:13900"

pekko.remote.artery.canonical.port = 11234
pekko.cluster.seed-nodes = ["pekko://pfi@localhost:11234"]

# Process uploads with the real local extractors.
worker.enabled = true
worker.interval = 1 second
worker.useExternalExtractors = false
ingestion.scratchPath = ${E2E_RUNTIME_DIR}"/ingestion"
preview.workspace = ${E2E_RUNTIME_DIR}"/preview"
