# Disposable services for run.sh; never uses development volumes.
services:
  neo4j:
    extends:
      file: ../docker-compose.yml
      service: neo4j
    container_name: !reset null
    environment:
      NEO4J_dbms_connector_bolt_advertised__address: !reset null
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: !override
      - "127.0.0.1:17687:7687"
    volumes: !override
      - neo4j:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 60

  elasticsearch:
    extends:
      file: ../docker-compose.yml
      service: elasticsearch
    container_name: !reset null
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: !override
      - "127.0.0.1:19200:9200"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s",
        ]
      interval: 5s
      timeout: 10s
      retries: 60

  postgres:
    extends:
      file: ../docker-compose.yml
      service: postgres
    ports: !override
      - "127.0.0.1:18432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giant_master -d giant"]
      interval: 5s
      timeout: 5s
      retries: 30

  garage:
    extends:
      file: ../docker-compose.yml
      service: garage
    container_name: !reset null
    restart: "no"
    ports: !override
      - "127.0.0.1:13900:3900"
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "unused-bucket"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j:
  elasticsearch:
  postgres-data:
  garage-data:
  garage-meta:
